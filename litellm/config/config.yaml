# LiteLLM Configuration
# Reference: https://docs.litellm.ai/docs/configuration

general:
  debug: false
  verbose: false

server:
  host: "0.0.0.0"
  port: 4000
  workers: 4
  timeout: 600

database:
  type: "sqlite"
  url: "sqlite:///var/lib/litellm/litellm.db"

cache:
  type: "redis"
  host: "localhost"
  port: 6379
  ttl: 3600

logging:
  level: "INFO"
  format: "json"
  file: "/var/log/litellm/litellm.log"

models:
  - model_name: "gpt-3.5-turbo"
    litellm_params:
      model: "gpt-3.5-turbo"
      api_key: "${OPENAI_API_KEY}"
  
  - model_name: "gpt-4"
    litellm_params:
      model: "gpt-4"
      api_key: "${OPENAI_API_KEY}"

router_settings:
  routing_strategy: "least-busy"
  fallbacks:
    - "gpt-3.5-turbo"
  retry_policy:
    max_retries: 3
    retry_interval: 1

proxy_settings:
  admin_key: "${LITELLM_ADMIN_KEY}"
  ui_enabled: true
  docs_enabled: true
# Redis Configuration

## Main configuration file

The main configuration file is `/etc/redis/redis.conf`. It uses a custom format for Redis settings.

### Default Configuration

```conf
# Network settings
bind 127.0.0.1  # Listen interface (localhost only)
port 6379  # TCP port number

# Logging
loglevel notice  # Debug level (debug, verbose, notice, warning)
logfile /var/log/redis/redis.log  # Log file path

# Persistence
save 900 1  # Save after 900s if at least 1 key changed
save 300 10  # Save after 300s if at least 10 keys changed
save 60 10000  # Save after 60s if at least 10000 keys changed

# RDB file
dbfilename dump.rdb  # RDB filename
dir /var/lib/redis/  # Directory for RDB files

# Memory limits
maxmemory 256mb  # Maximum memory usage
maxmemory-policy allkeys-lru  # Eviction policy

# Security
requirepass ""  # Require password (empty = disabled)
```

### Network Options

| Option | Description | Default |
|--------|-------------|---------|
| `bind` | Listen interface | `127.0.0.1` |
| `port` | TCP port number | `6379` |
| `timeout` | Client timeout (seconds) | `0` (disabled) |

### Persistence Options

| Option | Description |
|--------|-------------|
| `save` | Save RDB snapshots (timelimit count) |
| `dbfilename` | RDB file name |
| `dir` | Directory for RDB files |
| `appendonly` | Enable AOF persistence |
| `appendfilename` | AOF file name |

### Memory Options

| Option | Description |
|--------|-------------|
| `maxmemory` | Maximum memory usage |
| `maxmemory-policy` | Eviction policy (allkeys-lru, noeviction, etc.) |

### Security Options

| Option | Description |
|--------|-------------|
| `requirepass` | Require password for connections |
| `rename-command` | Rename/disable commands |

### File Locations

| System | Config Path |
|--------|-------------|
| Linux (systemd) | `/etc/redis/redis.conf` |
| Windows | `C:\Redis\redis.conf` |

### Services Related

Redis often works with:
- `memcached` - Another caching solution (faster, but no persistence)
- `haproxy` - Load balancing for Redis
- `sentinel` - Redis high availability
- `node.js` / `python` - Application usage
# Node.js Configuration
# Path: /etc/node/config.yaml

# Server Settings
port: 3000
debug_port: 9229
host: "0.0.0.0"

# Process Settings
user: "node"
group: "node"
workers: "auto"

# Logging
log_level: "info"
log_file: "/var/log/node/app.log"
error_log: "/var/log/node/error.log"

# Environment
node_env: "production"

# Health Check
health_check_path: "/health"
health_check_interval: 30

# SSL (optional)
ssl:
  enabled: false
  cert: "/etc/node/ssl/cert.pem"
  key: "/etc/node/ssl/key.pem"

# App Entry Point
app: "/etc/node/server.js"
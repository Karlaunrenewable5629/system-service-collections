# Kong Configuration File
# Generated by Kong

#### Core ####
proxy_listen = 0.0.0.0:8000
proxy_listen_ssl = 0.0.0.0:8443
admin_listen = 0.0.0.0:8001
admin_gui_listen = 0.0.0.0:8002

#### Database ####
database = postgres
pg_host = localhost
pg_port = 5432
pg_database = kong
pg_user = kong
pg_password = kong_password

#### Plugins ####
plugins = bundled

#### Logging ####
log_level = notice
error_tracing = on

#### Nginx Tuning ####
worker_processes = auto
worker_rlimit_nofile = 65535
nginx_user = kong

#### Proxy ###
proxy_ssl_enabled = true
proxy_ssl_cert = /etc/kong/ssl/kong-cert.pem
proxy_ssl_cert_key = /etc/kong/ssl/kong-key.pem

#### Security ####
admin_gui_auth = basic-auth
admin_gui_auth_basic_ldap = off

#### Healthchecks ####
healthchecks_timeout = 1
healthchecks_interval = 10
healthchecks_threshold = 3
healthchecks_http_statuses = 200, 302, 400, 401, 402, 403, 404, 405, 406, 407, 408, 409, 410, 411, 412, 413, 414, 415, 416, 417, 418, 421, 422, 423, 424, 425, 426, 428, 429, 430, 431, 451, 500, 501, 502, 503, 504, 505, 506, 507, 508, 510, 511
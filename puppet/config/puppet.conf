# Puppet Agent Configuration

## Main configuration file

The main configuration file is `/etc/puppetlabs/puppet/puppet.conf`. It uses INI-style format for puppet settings.

### Default Configuration

```ini
[main]
    # Log configuration
    loglevel = info
    logfile = /var/log/puppet/puppet.log

    # Server configuration
    server = puppet
    runinterval = 1h

    # Authentication
    certname = $(hostname -f)

    # Directory configuration
    basemasterdir = /etc/puppetlabs/puppet
    codedir = /etc/puppetlabs/code/environments/production
    templatedir = /etc/puppetlabs/puppet/templates
    plugindestdir = /etc/puppetlabs/puppet/custom

    # Fact configuration
    facts = /opt/puppetlabs/facter/facts.d

    # Run as user (root by default, can set to puppet)
    runas = root
```

### Server Options

| Option | Description | Default |
|--------|-------------|---------|
| `server` | Puppet master hostname | puppet |
| `runinterval` | How often to run (in seconds) | 1h |
| `certname` | Certificate name (defaults to FQDN) | $(hostname -f) |
| `classfile` | Class file path | - |
| `preruncommand` | Command to run before catalog retrieval | - |
| `postruncommand` | Command to run after catalog apply | - |

### File Locations

| System | Config Path |
|--------|-------------|
| Linux | `/etc/puppetlabs/puppet/puppet.conf` |
| Windows | `C:\ProgramData\PuppetLabs\puppet\conf\puppet.conf` |

### Services Related

The puppet agent works alongside:
- `puppetserver` - The puppet master server
- `puppetdb` - Database for storing node data
- `pe- orchestrator` - Orchestration tool (PE only)
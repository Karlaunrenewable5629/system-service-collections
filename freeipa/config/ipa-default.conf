# /etc/ipa/default.conf
#
# FreeIPA Default Configuration Template
# ----------------------------------------
# This file is generated by ipa-server-install or ipa-client-install.
# Manual edits are possible but will be overwritten on reinstall.
#
# Replace all placeholder values (UPPERCASE) before use.
# Refer to config/README.md for parameter descriptions.

[global]

# ---------------------------------------------------------------------------
# Identity / Realm
# ---------------------------------------------------------------------------

# Kerberos realm — must be the uppercase form of your domain
realm = EXAMPLE.COM

# DNS domain name (lowercase)
domain = example.com

# LDAP base DN derived from the domain
basedn = dc=example,dc=com

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------

# Fully qualified domain name of the primary IPA server
server = ipa.example.com

# FQDN of this host (same as server on the server node)
host = ipa.example.com

# XMLRPC API endpoint
xmlrpc_uri = https://ipa.example.com/ipa/xml

# JSON-RPC API endpoint (preferred for newer clients)
jsonrpc_uri = https://ipa.example.com/ipa/json

# ---------------------------------------------------------------------------
# Certificate Authority
# ---------------------------------------------------------------------------

# Use the built-in Dogtag CA
enable_ra = True

# CA plugin — 'dogtag' for full CA, 'none' if using external CA
ra_plugin = dogtag

# Dogtag profile to use for host certificates
# Default: caIPAserviceCert
#dogtag_version = 10

# ---------------------------------------------------------------------------
# Operational Mode
# ---------------------------------------------------------------------------

# Mode: production | debug
mode = production

# ---------------------------------------------------------------------------
# TLS / Certificate Verification
# ---------------------------------------------------------------------------

# Path to the IPA CA certificate bundle
# This file is created by ipa-server-install / ipa-client-install
#ca_cert_filename = /etc/ipa/ca.crt

# Verify the server TLS certificate (True recommended for production)
#verify_ap_reqparams = True

# ---------------------------------------------------------------------------
# LDAP Connection
# ---------------------------------------------------------------------------

# LDAP URI used by ipa CLI tools
# ldap_uri = ldap://ipa.example.com

# Use StartTLS for LDAP connections
# tls_reqcert = demand

# ---------------------------------------------------------------------------
# Replication (multi-master / replica settings)
# ---------------------------------------------------------------------------

# Replica-specific section — uncomment on replica servers
# [server]
# ipaapi_user = apache
# ipaapi_group = apache

# ---------------------------------------------------------------------------
# DNS (if FreeIPA manages DNS)
# ---------------------------------------------------------------------------

# DNS server addresses used by IPA utilities
# dns_lookup_kdc = True
# dns_lookup_realm = True

# ---------------------------------------------------------------------------
# Session / Timeout
# ---------------------------------------------------------------------------

# IPA API session timeout in seconds (default: 1200)
#session_auth_duration = 1200

# Maximum KRB5 ticket lifetime
#ticket_lifetime = 24h

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

# Log level: 0=WARNING, 1=INFO, 2=DEBUG (default: 0)
# Increase for troubleshooting only — very verbose at level 2
#debug = False
#verbose = False

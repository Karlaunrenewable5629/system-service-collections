# Podman/containers configuration
# System-wide: /etc/containers/containers.conf
# User-level:  ~/.config/containers/containers.conf
# Reference: https://github.com/containers/common/blob/main/docs/containers.conf.5.md

[containers]

# Default capabilities for containers
default_capabilities = [
    "CHOWN",
    "DAC_OVERRIDE",
    "FOWNER",
    "FSETID",
    "KILL",
    "NET_BIND_SERVICE",
    "SETFCAP",
    "SETGID",
    "SETPCAP",
    "SETUID",
    "SYS_CHROOT",
]

# Default environment variables
default_env = [
    "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
    "TERM=xterm",
]

# Default DNS servers
dns_servers = []

# Default ulimits
default_ulimits = [
    "nofile=65536:65536",
]

# Log driver: k8s-file, journald, none, passthrough
log_driver = "journald"

# Default log size limit
log_size_max = -1

# PID limit (-1 for unlimited)
pids_limit = 2048

# OCI runtime to use
# Options: runc, crun, kata, runsc
# default_capabilities depends on runtime
# crun is faster and uses less memory
# runtime = "crun"

[engine]

# Container state directory
# state_dir = "/run/containers/storage"

# Default OCI runtime
runtime = "crun"

# Path to OCI runtimes
runtimes = {
    "crun" = ["/usr/bin/crun", "/usr/local/bin/crun"],
    "runc" = ["/usr/bin/runc", "/usr/local/sbin/runc"],
}

# Number of lock shims to create
num_locks = 2048

# Use cgroups v2
cgroup_manager = "systemd"

# Events logger: journald, file, none
events_logger = "journald"

# Image pull policy: always, missing, never
pull_policy = "missing"

# Stop timeout in seconds
stop_timeout = 10

# Compress manifest list
compress = false

# Network backend: netavark, cni
network_backend = "netavark"

[network]

# Default CNI/Netavark network
default_network = "podman"

# Default subnet
default_subnet = "10.88.0.0/16"

# DNS bind port (rootless)
dns_bind_port = 53

[machine]

# Podman machine disk size (GB)
disk_size = 100

# Podman machine memory (MB)
memory = 2048

# Number of CPUs
cpus = 1

# Podman registry configuration
# System-wide: /etc/containers/registries.conf
# User-level:  ~/.config/containers/registries.conf
# Reference: https://github.com/containers/image/blob/main/docs/containers-registries.conf.5.md

# Default registries searched when pulling unqualified image names
# e.g. `podman pull nginx` will search these registries in order
unqualified-search-registries = ["docker.io", "quay.io", "ghcr.io"]

# Disable pulling from specific registries
# [[registry]]
# location = "registry.example.com"
# blocked = true

# Registry mirror for docker.io
# [[registry]]
# location = "docker.io"
#
# [[registry.mirror]]
# location = "mirror.example.com"

# Insecure (HTTP) private registry
# [[registry]]
# location = "registry.local:5000"
# insecure = true

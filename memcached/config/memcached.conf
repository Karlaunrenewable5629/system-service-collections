# Memcached Configuration

## Main configuration file

The main configuration file is `/etc/memcached.conf`. It uses INI-style format for memcached settings.

### Default Configuration

```ini
# Memory allocation
-m 64  # 64 MB (default)
-c 0   # Connection cache size (disabled by default)
-l 127.0.0.1  # Listen interface (localhost only)
-p 11211  # Port number
-U 0   # UDP port number (0 = disabled)

# Performance settings
-l maxconns 1024  # Maximum number of connections
-G 64   # Garbage collection time (seconds)
-R 1    # Factor in calculating the max object size
-O      # Use raw and inline system calls
-v      # Be verbose
-D      # Check for duplicate structures
-y      # Disabled by default (disable diag)
```

### Interface Options

| Option | Description | Default |
|--------|-------------|---------|
| `-l` | Listen interface (IP or hostname) | `127.0.0.1` |
| `-p` | TCP port number | `11211` |
| `-U` | UDP port number | `0` (disabled) |
| `-maxconns` | Max simultaneous connections | `1024` |

### Performance Options

| Option | Description | Default |
|--------|-------------|---------|
| `-m` | Memory size in MB | `64` |
| `-c` | Maximum connections | `1024` |
| `-v` | Verbose output | - |
| `-d` | Run in daemon mode | - |
| `-f` | Thread increment size | `1` |
| `-n` | Minimum memory chunk size | `48` |
| `-t` | Number of threads | `4` |

### File Locations

| System | Config Path |
|--------|-------------|
| Linux (systemd) | `/etc/memcached.conf` |
| Windows | `C:\memcached\memcached.ini` |

### Services Related

Memcached often works with:
- `redis` - Another caching solution
- `varnish` - HTTP accelerator/cache
- `php-fpm` - PHP fastCGI cache
- `node.js` - Application cache
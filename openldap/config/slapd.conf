# ==============================================================================
# slapd.conf — OpenLDAP Daemon Configuration Template
# ==============================================================================
# This file is a template for configuring slapd using the classic flat-file
# format. Adjust all values marked with <PLACEHOLDER> before use.
#
# For production deployments, consider migrating to OLC (cn=config):
#   slaptest -f /etc/openldap/slapd.conf -F /etc/ldap/slapd.d
#
# Reference: https://www.openldap.org/doc/admin26/
# ==============================================================================

# ------------------------------------------------------------------------------
# Schema Definitions
# Include the core schemas required for your directory.
# Paths vary by distribution (Debian: /etc/ldap/schema/, RHEL: /etc/openldap/schema/)
# ------------------------------------------------------------------------------
include         /etc/openldap/schema/core.schema
include         /etc/openldap/schema/cosine.schema
include         /etc/openldap/schema/inetorgperson.schema
include         /etc/openldap/schema/nis.schema
# include       /etc/openldap/schema/ppolicy.schema   # Uncomment for password policy

# ------------------------------------------------------------------------------
# Global Settings
# ------------------------------------------------------------------------------
# PID file and args file locations
pidfile         /var/run/openldap/slapd.pid
argsfile        /var/run/openldap/slapd.args

# Logging level (256 = stats, -1 = all, 0 = none)
# See: https://www.openldap.org/doc/admin26/slapdconf2.html#loglevel
loglevel        256

# ------------------------------------------------------------------------------
# TLS / LDAPS Configuration
# Uncomment and configure to enable encrypted connections on port 636.
# ------------------------------------------------------------------------------
# TLSCACertificateFile  /etc/openldap/tls/ca.crt
# TLSCertificateFile    /etc/openldap/tls/slapd.crt
# TLSCertificateKeyFile /etc/openldap/tls/slapd.key
# TLSCipherSuite        HIGH:MEDIUM:!SSLv2:!SSLv3
# TLSVerifyClient       never

# ------------------------------------------------------------------------------
# Module Loading
# Required when OpenLDAP is compiled with module support (most distro packages).
# Comment out if slapd is compiled with backends/overlays built-in.
# ------------------------------------------------------------------------------
# modulepath    /usr/lib/openldap
# modulepath    /usr/lib64/openldap

# moduleload    back_mdb.la
# moduleload    memberof.la
# moduleload    ppolicy.la
# moduleload    syncprov.la

# ------------------------------------------------------------------------------
# Database: MDB (LMDB) Backend
# Change dc=example,dc=com to match your organization's domain.
# ------------------------------------------------------------------------------
database        mdb

# The base DN (Distinguished Name) for this directory
suffix          "dc=example,dc=com"

# Root DN — the directory administrator account
rootdn          "cn=Manager,dc=example,dc=com"

# Root password — generate with: slappasswd -h {SSHA}
# Replace the value below with the output of slappasswd
rootpw          {SSHA}REPLACE_WITH_SLAPPASSWD_OUTPUT

# Directory on disk where the LMDB database files are stored
directory       /var/lib/ldap

# Maximum database size (bytes). Default 1 GB. Increase for large directories.
maxsize         1073741824

# ------------------------------------------------------------------------------
# Indexes
# Define indexes to speed up common search operations.
# Format: index <attribute> <index-type>
# Types: eq (equality), pres (presence), sub (substring), approx (approximate)
# ------------------------------------------------------------------------------
index   objectClass     eq
index   cn              pres,sub,eq
index   uid             pres,sub,eq
index   uidNumber       eq
index   gidNumber       eq
index   memberUid       eq
index   mail            pres,sub,eq
index   sn              pres,sub,eq
index   givenName       pres,sub,eq
index   dc              sub,eq
index   ou              sub,eq
index   entryCSN        eq
index   entryUUID       eq

# ------------------------------------------------------------------------------
# Access Control Lists (ACLs)
# Rules are evaluated top-to-bottom; first match wins.
# Tighten these rules for production deployments.
# ------------------------------------------------------------------------------

# Allow users to update their own password
access to attrs=userPassword,shadowLastChange
  by self write
  by anonymous auth
  by dn="cn=Manager,dc=example,dc=com" write
  by * none

# Allow read access to everything else by authenticated users
access to *
  by self write
  by dn="cn=Manager,dc=example,dc=com" write
  by users read
  by * none

# ------------------------------------------------------------------------------
# Overlay: MemberOf
# Automatically maintains the memberOf attribute on user entries.
# Requires memberof module to be loaded above.
# ------------------------------------------------------------------------------
# overlay memberof
# memberof-dangling    ignore
# memberof-refint      TRUE
# memberof-group-oc    groupOfNames
# memberof-member-ad   member
# memberof-memberof-ad memberOf

# ------------------------------------------------------------------------------
# Overlay: Password Policy (ppolicy)
# Enforces password expiry, lockout, and quality rules.
# Requires ppolicy module and ppolicy.schema to be loaded above.
# ------------------------------------------------------------------------------
# overlay ppolicy
# ppolicy-default "cn=default,ou=policies,dc=example,dc=com"
# ppolicy-hash-cleartext TRUE
# ppolicy-use-lockout TRUE

# ------------------------------------------------------------------------------
# Overlay: Sync Provider (for replication)
# Enable on the provider (master) side.
# ------------------------------------------------------------------------------
# overlay syncprov
# syncprov-checkpoint 100 10
# syncprov-sessionlog 200

# ------------------------------------------------------------------------------
# Replication Consumer (Syncrepl)
# Configure on the consumer (replica) side.
# ------------------------------------------------------------------------------
# syncrepl rid=001
#   provider=ldap://provider.example.com:389
#   type=refreshAndPersist
#   retry="5 5 300 5"
#   searchbase="dc=example,dc=com"
#   attrs="*,+"
#   bindmethod=simple
#   binddn="cn=replicator,dc=example,dc=com"
#   credentials=<REPLICATION_PASSWORD>
#   tls_reqcert=demand
#
# mirrormode on

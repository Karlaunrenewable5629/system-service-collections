# =============================================================================
# Keycloak Configuration
# https://www.keycloak.org/server/configuration
# =============================================================================
# Place this file at:
#   Linux:   /etc/keycloak/keycloak.conf  (or $KC_HOME/conf/keycloak.conf)
#   Windows: C:\keycloak\conf\keycloak.conf
#
# After changing build-time options (db, features, http), run:
#   kc.sh build   (Linux)
#   kc.bat build  (Windows)
# then restart the service.
# =============================================================================

# -----------------------------------------------------------------------------
# Database
# -----------------------------------------------------------------------------
# Vendor: dev-file | dev-mem | postgres | mysql | mariadb | mssql | oracle
db=postgres

# JDBC connection (auto-constructed if using the individual options below)
# db-url=jdbc:postgresql://localhost/keycloak

db-url-host=localhost
db-url-database=keycloak
db-url-port=5432
db-username=keycloak
db-password=change_me

# Connection pool
db-pool-min-size=5
db-pool-max-size=100

# -----------------------------------------------------------------------------
# HTTP
# -----------------------------------------------------------------------------
# Enable plain HTTP (set true when TLS is terminated by a reverse proxy)
http-enabled=true
http-host=0.0.0.0
http-port=8080

# -----------------------------------------------------------------------------
# HTTPS
# -----------------------------------------------------------------------------
https-port=8443

# PEM certificate (mutually exclusive with key-store options)
# https-certificate-file=/etc/keycloak/tls/server.crt
# https-certificate-key-file=/etc/keycloak/tls/server.key

# Java KeyStore (alternative to PEM)
# https-key-store-file=/etc/keycloak/tls/keycloak.jks
# https-key-store-password=changeit

https-protocols=TLSv1.3,TLSv1.2

# -----------------------------------------------------------------------------
# Hostname
# -----------------------------------------------------------------------------
# Public URL used in tokens, login redirects, and admin links.
# Must be set for production deployments.
hostname=auth.example.com

# Override the port advertised in URLs (useful when behind a proxy on port 443)
# hostname-port=443

# Separate admin console URL (optional)
# hostname-admin=admin.example.com

# Disallow requests with non-matching Host headers
hostname-strict=true
hostname-strict-backchannel=false

# -----------------------------------------------------------------------------
# Proxy
# -----------------------------------------------------------------------------
# Proxy mode when Keycloak sits behind a reverse proxy:
#   none        - no proxy (direct exposure)
#   edge        - proxy handles TLS, Keycloak receives HTTP
#   reencrypt   - proxy re-encrypts, Keycloak receives HTTPS
#   passthrough - proxy passes TLS through, Keycloak handles it
proxy=edge

# -----------------------------------------------------------------------------
# Cache
# -----------------------------------------------------------------------------
# Use 'local' for single-node, 'ispn' for clustered deployments
cache=ispn
cache-stack=udp

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# Handlers: console | file | syslog (comma-separated)
log=console,file

log-level=info

# Console output format: default | json
log-console-output=default

# File log settings
log-file=/var/log/keycloak/keycloak.log

# -----------------------------------------------------------------------------
# Features
# -----------------------------------------------------------------------------
# Enable optional features
# features=token-exchange,scripts

# Disable features
# features-disabled=impersonation

# -----------------------------------------------------------------------------
# Health & Metrics
# -----------------------------------------------------------------------------
health-enabled=true
metrics-enabled=false

# -----------------------------------------------------------------------------
# Transaction
# -----------------------------------------------------------------------------
# Use XA transactions (requires XA-capable JDBC driver)
# transaction-xa-enabled=true
